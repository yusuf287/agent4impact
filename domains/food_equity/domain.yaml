# FOOD EQUITY — worked example. Copy domains/_template.yaml for a new challenge.
agent_name: foodbridge_analyst
description: Analyzes neighborhood food access, predicts high-need areas, and recommends where to place food resources.
persona: a data analyst supporting a city food-security task force that must decide where to send limited resources.
mission: Help planners find the neighborhoods with the greatest unmet food need, explain why, predict who is at risk next, and recommend actions.
audience: busy city planners and non-profit coordinators

brand:
  palette: ["#2E7D32", "#F9A825", "#1565C0", "#C62828"]

tables:
  neighborhoods:
    description: One row per neighborhood with demographics and geography (synthetic data).
    columns:
      neighborhood_id: Unique ID (join key).
      name: Neighborhood display name.
      district: City district (North/South/East/West/Central).
      population: Resident count.
      median_income: Median household income in dollars.
      pct_no_vehicle: Share of households with no vehicle (0-1).
      pct_seniors: Share of residents aged 65+ (0-1).
      distance_to_grocery_km: Average distance to nearest full grocery store in km.
      lat: Latitude of the neighborhood centre.
      lon: Longitude of the neighborhood centre.
  food_outlets:
    description: One row per food outlet (grocery, pantry, corner store, farmers market).
    columns:
      outlet_id: Unique outlet ID.
      neighborhood_id: FK to neighborhoods.
      outlet_type: grocery | pantry | corner_store | farmers_market.
      accepts_ebt: 1 if the outlet accepts EBT/SNAP benefits, else 0.
  food_insecurity_survey:
    description: Yearly survey result per neighborhood, 2019-2024.
    columns:
      neighborhood_id: FK to neighborhoods.
      year: Survey year.
      insecurity_rate: Share of households food insecure (0-1).
      high_need: 1 if insecurity_rate >= 0.22 (the ML label).
  v_neighborhood_features:
    description: PREFERRED analytical view — neighborhood x year with demographics, outlet counts and the high_need label.
    columns:
      neighborhood_name: Display name.
      outlets_per_1k: Food outlets per 1,000 residents.
      outlet_count: Total outlets in the neighborhood.
      grocery_count: Full grocery stores in the neighborhood.
      insecurity_rate: Share of households food insecure that year (0-1).
      high_need: 1 if insecurity_rate >= 0.22.

bqml:
  instructions: >
    A logistic regression model `need_model` (trained on years <= 2023) predicts the probability a
    neighborhood is high-need from income, vehicle access, seniors share, grocery distance and outlet density.
    Predictions are for 2024 (held out). Explain it is a model estimate; mention misses honestly.
  predict_sql: |
    SELECT neighborhood_name, district,
           ROUND(p.prob, 3) AS high_need_probability,
           ROUND(insecurity_rate, 3) AS actual_insecurity_rate_2024,
           median_income, pct_no_vehicle, distance_to_grocery_km
    FROM ML.PREDICT(MODEL `{project}.{dataset}.need_model`,
      (SELECT * FROM `{project}.{dataset}.v_neighborhood_features` WHERE year = 2024)),
      UNNEST(predicted_high_need_probs) AS p
    WHERE p.label = 1
    ORDER BY p.prob DESC
    LIMIT {top_n}

routing_rules:
  - 'Counts, rankings, comparisons over history -> BigQuery SQL on v_neighborhood_features.'
  - 'Which areas are at risk / predicted need -> run_model_predictions.'
  - 'Where to place a pantry or mobile market -> rank by predicted probability, then population and distance_to_grocery_km; explain the trade-off.'

live_api:
  enabled: false
  allowed_hosts: ["api.open-meteo.com"]

a2a_description: Remote specialist (e.g. routing/logistics) the analyst can hand work to.

pipeline: {}   # empty = use defaults in kit_agent/workflow.py

demo_questions:
  - "How many neighborhoods are in the data and what is the average insecurity rate by district in 2024?"
  - {q: "Which 5 neighborhoods are most likely high-need in 2024, and why?", expect_tools: [run_model_predictions]}
  - {q: "Chart the top 10 neighborhoods by predicted need.", expect_tools: [visualization_agent]}
  - {q: "Write a decision brief on where to place two mobile pantries.", expect_tools: [response_team]}
