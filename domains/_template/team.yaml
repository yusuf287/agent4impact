# Multi-agent team. Roles: python -m kit roles   Validate: python -m kit team-check
# Pick roles, give each an output_key, say who `reads` what, then order them in `flow`.
# Do NOT put literal curly braces in instructions (ADK treats {name?} as a state template).
team:
  name: response_team
  description: "Runs the full analysis for complex or report-style requests: evidence, challenge, plan, brief, approval."
  agents:
    scout:    {role: scout,    output_key: scout_out}
    skeptic:  {role: skeptic,  output_key: skeptic_out,  reads: [scout_out]}
    planner:  {role: planner,  output_key: plan_out,     reads: [scout_out, skeptic_out]}
    writer:   {role: writer,   output_key: report,       reads: [scout_out, skeptic_out, plan_out]}
    critic:   {role: critic,                              reads: [report, scout_out]}
    formatter: {role: formatter, output_schema: ActionPlan, output_key: final_plan, reads: [report]}
  flow:
    - scout
    - parallel: [skeptic, planner]
    - loop: {agents: [writer, critic], max_iterations: 3}
    - formatter
